<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Hemmelige Oppdrag</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Inter:wght@400;500;600&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f5f0e8;
      font-family: 'Inter', sans-serif;
      color: #111;
      padding: 24px;
    }

    h1 {
      font-family: 'Special Elite', monospace;
      font-size: 26px;
      margin-bottom: 4px;
      color: #1a0000;
    }

    .subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 24px;
    }

    .setup-box {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 20px;
      margin-bottom: 32px;
      max-width: 640px;
    }

    .setup-box h2 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #555;
    }

    .url-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .url-row input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
      font-family: monospace;
    }

    .url-row button {
      padding: 10px 18px;
      background: #8b0000;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
    }
    .url-row button:hover { background: #a00000; }

    .url-hint {
      font-size: 12px;
      color: #888;
      margin-top: 8px;
    }

    .print-btn {
      display: inline-block;
      margin-left: 12px;
      padding: 10px 18px;
      background: #1a1a2e;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }
    .print-btn:hover { background: #16213e; }

    /* Grid of QR cards */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .qr-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 20px;
      text-align: center;
      page-break-inside: avoid;
      break-inside: avoid;
    }

    .qr-card .number {
      font-family: 'Special Elite', monospace;
      font-size: 11px;
      letter-spacing: 3px;
      color: #8b0000;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .qr-card .name {
      font-family: 'Special Elite', monospace;
      font-size: 20px;
      margin-bottom: 4px;
      color: #111;
    }

    .qr-card .mission-label {
      font-size: 12px;
      color: #888;
      margin-bottom: 14px;
      font-style: italic;
    }

    .qr-card .qr-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 14px;
    }

    .qr-card .qr-wrapper canvas,
    .qr-card .qr-wrapper img {
      border: 6px solid #fff;
      outline: 1px solid #ddd;
    }

    .qr-card .url-display {
      font-size: 10px;
      color: #bbb;
      word-break: break-all;
      font-family: monospace;
    }

    .mission-preview {
      margin-top: 12px;
      padding: 10px;
      background: #faf7f2;
      border-left: 3px solid #8b0000;
      text-align: left;
      font-size: 12px;
      color: #555;
      line-height: 1.5;
      border-radius: 0 4px 4px 0;
    }

    .toggle-preview {
      background: none;
      border: 1px solid #ddd;
      border-radius: 3px;
      padding: 4px 10px;
      font-size: 11px;
      color: #888;
      cursor: pointer;
      margin-top: 8px;
    }

    .legend {
      max-width: 640px;
      margin-bottom: 28px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 16px 20px;
    }
    .legend h2 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #555;
      margin-bottom: 10px;
    }
    .legend table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .legend td { padding: 5px 8px; border-bottom: 1px solid #f0f0f0; }
    .legend td:first-child { color: #8b0000; font-weight: 600; width: 40px; }
    .legend td:nth-child(2) { font-family: 'Special Elite', monospace; width: 140px; }

    @media print {
      body { background: #fff; padding: 0; }
      .setup-box, .legend, .print-btn, .toggle-preview, .no-print { display: none !important; }
      .grid { grid-template-columns: repeat(3, 1fr); gap: 12px; }
      .qr-card { border: 1px solid #ccc; padding: 12px; }
      .mission-preview { display: none !important; }
      .url-display { display: none; }
    }
  </style>
</head>
<body>

  <h1>Hemmelige Oppdrag</h1>
  <p class="subtitle">Admin — Utdrikningslag, Fossen Friluft</p>

  <div class="setup-box no-print">
    <h2>GitHub Pages URL</h2>
    <div class="url-row">
      <input type="text" id="baseUrl"
        placeholder="https://brukernavn.github.io/repo-navn"
        value="">
      <button onclick="regenerate()">Oppdater QR</button>
      <button class="print-btn" onclick="window.print()">Print</button>
    </div>
    <p class="url-hint">
      Etter at appen er hostet på GitHub Pages, lim inn URL-en her og trykk «Oppdater QR»
      for å lage korrekte QR-koder for alle deltakere.
    </p>
  </div>

  <div class="legend no-print">
    <h2>Oversikt — hvem har hvilket oppdrag</h2>
    <table id="legendTable"></table>
  </div>

  <div class="grid" id="grid"></div>

  <script>
    const PARTICIPANTS = [
      { name: "Halvor",       mission: 1 },
      { name: "Snorre",       mission: 2 },
      { name: "Hans",         mission: 3 },
      { name: "Ørjan",        mission: 4 },
      { name: "Micheal",      mission: 5 },
      { name: "Anders",       mission: 6 },
      { name: "Bare",         mission: 7 },
      { name: "Ole Martin",   mission: 8 },
      { name: "Jens Petter",  mission: 9 },
      { name: "Per Øystein",  mission: 10 },
      { name: "Erik",         mission: 11 },
      { name: "???",          mission: 12 }  // 12. deltaker — fyll inn navn
    ];

    const MISSIONS = [
      { title: "Feltfotografen",       text: "Ta minst 5 hemmelige bilder av de andre. Avslør dem lørdag kveld." },
      { title: "Faktadetektiven",      text: "Finn én overraskende fakta om brudgommen som de fleste ikke vet." },
      { title: "Komplimentmesteren",   text: "Gi alle de 11 andre én spesifikk og oppriktig kompliment." },
      { title: "Ja-generalen",         text: "Lørdag kveld i to timer: svar «Ja, absolutt!» på ALT." },
      { title: "Den Stumme",           text: "Kl. 20:00 lørdag: 30 min uten et eneste ord — kun kroppsspråk." },
      { title: "Løgnjegeren",          text: "Fortell gruppen tre historier: to sanne, én løgn." },
      { title: "Spåmannen",            text: "Skriv ned 3 spesifikke spådommer om helgen innen lørdag middag." },
      { title: "Hemmelig Kelner",      text: "Vær hemmelig servitør — tilby drikke og hent ting hele helgen." },
      { title: "Veddekongen",          text: "Inngå minst 3 veddemål med ulike folk om hva som skjer." },
      { title: "Kallenavnsgiveren",    text: "Gi alle de 11 andre et kallenavn basert på dine observasjoner." },
      { title: "Historiesamleren",     text: "Finn den morsomste/pinligste historien noen har — presenter søndag." },
      { title: "Karakterskuespilleren",text: "Hold en hemmelig personlighet ut hele kvelden lørdag." }
    ];

    function getBaseUrl() {
      const val = document.getElementById('baseUrl').value.trim().replace(/\/$/, '');
      return val || window.location.href.replace(/\/[^\/]*$/, '');
    }

    function buildUrl(participant) {
      const base = getBaseUrl();
      const n = encodeURIComponent(participant.name);
      return `${base}/secret-mission.html?m=${participant.mission}&n=${n}`;
    }

    function regenerate() {
      buildGrid();
    }

    function buildGrid() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      const legendTable = document.getElementById('legendTable');
      legendTable.innerHTML = '';

      PARTICIPANTS.forEach((p, idx) => {
        const mission = MISSIONS[p.mission - 1];
        const url = buildUrl(p);

        // Legend row
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>#${p.mission}</td><td>${p.name}</td><td style="color:#555">${mission.title}</td>`;
        legendTable.appendChild(tr);

        // QR card
        const card = document.createElement('div');
        card.className = 'qr-card';
        card.id = `card-${idx}`;

        const previewId = `preview-${idx}`;
        card.innerHTML = `
          <div class="number">Oppdrag ${String(p.mission).padStart(2, '0')} av 12</div>
          <div class="name">${p.name}</div>
          <div class="mission-label">${mission.title}</div>
          <div class="qr-wrapper" id="qr-${idx}"></div>
          <div class="url-display">${url}</div>
          <button class="toggle-preview no-print" onclick="togglePreview('${previewId}')">Vis oppdrag</button>
          <div class="mission-preview" id="${previewId}" style="display:none">${mission.text}</div>`;

        grid.appendChild(card);

        new QRCode(document.getElementById(`qr-${idx}`), {
          text: url,
          width: 180,
          height: 180,
          colorDark: "#111111",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });
      });
    }

    function togglePreview(id) {
      const el = document.getElementById(id);
      el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }

    buildGrid();
  </script>
</body>
</html>
