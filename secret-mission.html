<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Hemmelig Oppdrag</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Inter:wght@400;600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0d0d0d;
      color: #f0e6d3;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(139,0,0,0.12) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 70%, rgba(100,60,0,0.1) 0%, transparent 60%);
      pointer-events: none;
    }

    .grain {
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      opacity: 0.4;
    }

    .card {
      position: relative;
      max-width: 420px;
      width: 100%;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      padding: 36px 32px 40px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03),
        0 20px 60px rgba(0,0,0,0.8),
        inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #8b0000, #cc3300, #8b0000);
    }

    .top-label {
      font-family: 'Special Elite', monospace;
      font-size: 11px;
      letter-spacing: 4px;
      color: #8b0000;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 8px;
    }

    .divider {
      border: none;
      border-top: 1px solid #222;
      margin: 14px 0;
    }

    .stamp {
      font-family: 'Special Elite', monospace;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 6px;
      text-align: center;
      color: #8b0000;
      text-transform: uppercase;
      border: 3px solid #8b0000;
      display: inline-block;
      padding: 4px 14px;
      transform: rotate(-3deg);
      margin: 0 auto 20px;
      display: block;
      width: fit-content;
      opacity: 0.85;
      text-shadow: 1px 1px 0 rgba(139,0,0,0.3);
    }

    .mission-number {
      font-family: 'Special Elite', monospace;
      font-size: 12px;
      letter-spacing: 3px;
      color: #555;
      text-align: center;
      margin-bottom: 6px;
    }

    .participant-name {
      font-family: 'Special Elite', monospace;
      font-size: 22px;
      text-align: center;
      color: #d4a843;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    .mission-title {
      font-family: 'Special Elite', monospace;
      font-size: 20px;
      text-align: center;
      color: #f0e6d3;
      margin-bottom: 16px;
      letter-spacing: 1px;
    }

    .mission-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid #222;
      border-left: 3px solid #8b0000;
      border-radius: 2px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .mission-text {
      font-size: 16px;
      line-height: 1.7;
      color: #d0c4b0;
    }

    .mission-detail {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid #1e1e1e;
      font-size: 13px;
      color: #666;
      font-style: italic;
      line-height: 1.6;
    }

    .accept-btn {
      display: block;
      width: 100%;
      padding: 14px;
      background: #8b0000;
      color: #f0e6d3;
      border: none;
      border-radius: 2px;
      font-family: 'Special Elite', monospace;
      font-size: 16px;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s;
    }

    .accept-btn:hover { background: #a00000; }
    .accept-btn:active { background: #700000; }

    .accepted-banner {
      display: none;
      text-align: center;
      padding: 14px;
      background: rgba(0,80,0,0.2);
      border: 1px solid #1a5c1a;
      border-radius: 2px;
      color: #4caf50;
      font-family: 'Special Elite', monospace;
      font-size: 15px;
      letter-spacing: 2px;
    }

    .footer-note {
      margin-top: 20px;
      text-align: center;
      font-size: 11px;
      color: #333;
      letter-spacing: 2px;
      font-family: 'Special Elite', monospace;
    }

    /* Error state */
    .error-state {
      text-align: center;
    }
    .error-state h1 {
      font-family: 'Special Elite', monospace;
      font-size: 24px;
      color: #8b0000;
      margin-bottom: 12px;
    }
    .error-state p {
      color: #555;
      font-size: 14px;
      line-height: 1.6;
    }

    @media (max-width: 440px) {
      .card { padding: 28px 20px 32px; }
      .stamp { font-size: 22px; letter-spacing: 4px; }
    }
  </style>
</head>
<body>
  <div class="grain"></div>
  <div class="card" id="card">
    <!-- Injected by JS -->
  </div>

  <script>
    const MISSIONS = [
      {
        title: "Feltfotografen",
        text: "Du er helgens hemmelige fotograf. Ta minst 5 bilder av de andre uten at de merker det – jo mer spontane, jo bedre.",
        detail: "Avslør bildene lørdag kveld. Gruppen kårer det beste bildet. Du velger ikke selv."
      },
      {
        title: "Faktadetektiven",
        text: "Finn ut ett overraskende faktum om brudgommen som de fleste ikke vet. Grav det frem gjennom samtaler med de andre.",
        detail: "Presenter funnet ditt høyt til hele gjengen på et passende dramatisk tidspunkt."
      },
      {
        title: "Komplimentmesteren",
        text: "Gi alle de 11 andre én spesifikk og oppriktig kompliment i løpet av helgen. Ikke generisk – noe du faktisk observerer om dem.",
        detail: "Alle skal ha fått sin kompliment innen søndag lunsj. Sjekklistene er i hodet ditt."
      },
      {
        title: "Ja-generalen",
        text: "Lørdag kveld i to timer: svar «Ja, absolutt!» på ALT som blir sagt til deg – uansett hva det er.",
        detail: "Oppdages du i å nekte eller nøle, drikker du. Klokken starter når du bestemmer – men du MÅ starte."
      },
      {
        title: "Den Stumme",
        text: "Kl. 20:00 lørdag inntar du «stummeperioden» – 30 minutter uten å bruke ett eneste ord.",
        detail: "Kommuniser kun med kroppsspråk, peking og lyder. Klarer du hele perioden uten å bli avslørt, velger du én person som må gjøre noe dumt."
      },
      {
        title: "Løgnjegeren",
        text: "Fortell gruppen tre historier om deg selv: to sanne, én løgn. Prøv å overbevise dem om at løgnen er sann.",
        detail: "Klarer ingen å gjette riktig, kan du utfordre en selvvalgt person til å gjøre noe pinlig."
      },
      {
        title: "Spåmannen",
        text: "Innen middag lørdag: skriv ned 3 spesifikke spådommer om hva som vil skje i løpet av helgen. Lever dem til et vitne.",
        detail: "Søndag morgen leser du dem høyt for alle. Stemmer én eller flere av dem, er du udødeliggjort som helgens profet."
      },
      {
        title: "Hemmelig Kelner",
        text: "Du er helgens hemmelige servitør. Tilby alltid drikke til de andre, hent ting, fyll opp glass – hele helgen.",
        detail: "Gjør det uten å forklare hvorfor og aldri avsløre oppdraget ditt. Oppdages du, fortsetter du likevel."
      },
      {
        title: "Veddekongen",
        text: "Inngå minst 3 veddemål med forskjellige folk om hva som vil skje i helgen. Sett noe på spill – en tur, en sang, et stunt.",
        detail: "Veddemål skal handle om konkrete, observerbare ting. Formålet er å snakke med folk og gjøre helgen mer spennende."
      },
      {
        title: "Kallenavnsgiveren",
        text: "Gi alle de 11 andre et kallenavn basert på noe du observerer dem gjøre eller si i løpet av helgen.",
        detail: "Fortell dem kallenavnet – men ikke hvorfor du valgte det. Bruk bare kallenavnet derfra. Avslutt helgen med en «seremoni» der du avslører alle navnene og begrunnelsene."
      },
      {
        title: "Historiesamleren",
        text: "Finn den morsomste eller mest pinlige historien noen av de andre har. Still spørsmål, grav frem gullkorn.",
        detail: "Søndag frokost presenterer du «Historiekonkurransen»: les opp de beste historiene anonymt, og la gruppen kåre vinneren."
      },
      {
        title: "Karakterskuespilleren",
        text: "Velg en hemmelig personlighet og hold den ut HELE kvelden lørdag. For eksempel: ekstremt høflig og formell, overdrevet forsiktig, eller entusiastisk over absolutt alt.",
        detail: "Ingen får vite om oppdraget. Klarer noen å avsløre deg (si hva personligheten er), bestemmer de én ting du må gjøre."
      }
    ];

    function getParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        m: parseInt(params.get('m'), 10),
        n: params.get('n') || ''
      };
    }

    function render() {
      const { m, n } = getParams();
      const card = document.getElementById('card');

      if (!m || m < 1 || m > 12) {
        card.innerHTML = `
          <div class="error-state">
            <div class="stamp">Feil</div>
            <h1>Ugyldig oppdragskode</h1>
            <p>Skann din personlige QR-kode for å se ditt hemmelige oppdrag.</p>
          </div>`;
        return;
      }

      const mission = MISSIONS[m - 1];
      const name = n ? decodeURIComponent(n) : null;

      card.innerHTML = `
        <div class="top-label">Utdrikningslag — Fossen Friluft</div>
        <hr class="divider">
        <div class="stamp">Hemmelig</div>
        <div class="mission-number">OPPDRAG ${String(m).padStart(2, '0')} AV 12</div>
        ${name ? `<div class="participant-name">${escapeHtml(name)}</div>` : ''}
        <div class="mission-title">${mission.title}</div>
        <div class="mission-box">
          <div class="mission-text">${mission.text}</div>
          <div class="mission-detail">${mission.detail}</div>
        </div>
        <button class="accept-btn" id="acceptBtn" onclick="acceptMission()">
          Aksepter oppdrag
        </button>
        <div class="accepted-banner" id="acceptedBanner">
          ✓ Oppdrag akseptert — lykke til
        </div>
        <div class="footer-note">Del ikke dette oppdraget med noen</div>`;
    }

    function acceptMission() {
      document.getElementById('acceptBtn').style.display = 'none';
      document.getElementById('acceptedBanner').style.display = 'block';
    }

    function escapeHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    render();
  </script>
</body>
</html>
